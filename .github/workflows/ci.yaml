name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  epub:
    name: EPUB
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install pandoc
        run: brew install pandoc

      - name: Download NIPs
        run: make setup

      - name: Build EPUB
        run: make epub

      - name: Upload EPUB
        uses: actions/upload-artifact@v4
        with:
          name: nostr-book.epub
          path: nostr-book.epub

  pdf:
    name: PDF
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: brew install pandoc weasyprint

      - name: Download NIPs
        run: make setup

      - name: Build PDF
        timeout-minutes: 10
        run: make pdf

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: nostr-book.pdf
          path: nostr-book.pdf
