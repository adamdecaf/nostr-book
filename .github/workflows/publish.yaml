name: Publish Book

on:
  schedule:
    - cron: "0 12 * * *" # "12:00 UTC" - https://crontab.guru/#0_12_*_*_*e
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish Book
    runs-on: macos-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Install Dependencies
      run: |
        brew update
        brew install pandoc
        brew install --cask basictex
        eval "$(/usr/libexec/path_helper)"
        export PATH="/Library/TeX/texbin:$PATH"
        sudo tlmgr update --self
        sudo tlmgr install soul xcolor

    - name: Download NIPs
      run: |
        make setup
        cd nips/
        git log -n1
        cd ../

    - name: Create books
      run: |
        export PATH="/Library/TeX/texbin:$PATH"
        make epub
        make pdf || echo "PDF build failed; publishing EPUB anyway"

    - name: Commit and Push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "support@github.com"

        git add -A nostr-book.* ./include/git.md
        if git diff --cached --quiet; then
          echo "No published book changes"
        else
          git commit -m "chore: automated publishing"
          git push origin master
        fi
